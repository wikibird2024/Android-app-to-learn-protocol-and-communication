name: CI

on:
  push:
  pull_request:

jobs:
  app:
    name: App (analyze, tests, integration, APK)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # Our own clients against the community broker (Mosquitto) and the
      # fake bridge, which follows the same contract as the firmware.
      - name: Integration tests (Mosquitto, fake bridge, WebSocket echo)
        run: |
          sudo apt-get install -y --no-install-recommends mosquitto >/dev/null
          mosquitto -p 18830 -d
          python3 tool/fake_bridge.py --port 13333 --modbus-port 11502 --ws-port 18081 &
          sleep 1
          MQTT_TEST_PORT=18830 FAKE_BRIDGE_PORT=13333 FAKE_MODBUS_PORT=11502 FAKE_WS_PORT=18081 \
            flutter test --tags integration
      # One fixed release key (repo secrets), so every APK installs as an
      # update over the previous one. Without the secrets (a fork's PR) the
      # build falls back to a throwaway debug key and says so.
      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning title=APK signing::No ANDROID_KEYSTORE_BASE64 secret: signed with a throwaway debug key, so this APK will not install over an earlier one."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      # Job logs need a login to read; on failure the key lines also go out
      # as an annotation, which anyone can read through the API.
      # --build-number: the run number becomes versionCode, so each APK is
      # newer than the last (Android refuses to install an older one).
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if ! flutter build apk --release --build-number=${{ github.run_number }} 2>&1 | tee build.log; then
            summary=$(grep -iE "error|what went wrong|failed|exception|could not|unresolved" -A4 build.log \
                      | grep -v "^--$" | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=flutter build apk::${summary}"
            exit 1
          fi
      # The signer's fingerprint as a notice, so anyone can check through
      # the API that the fixed key signed it (only the public certificate).
      - name: Show APK signer
        run: |
          fingerprint=$(keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -m1 "SHA256:" | sed 's/.*SHA256: //')
          echo "::notice title=APK signer SHA-256 (versionCode ${{ github.run_number }})::${fingerprint}"
      - name: Keep APK
        uses: actions/upload-artifact@v4
        with:
          name: protocol-lab-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  firmware-host:
    name: Bridge host tests (plain C)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -S firmware/bridge/test/host -B build-host
          cmake --build build-host
          ctest --test-dir build-host --output-on-failure

  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Same major version as the dev machine, so both agree on the layout.
      - run: pip install clang-format==23.1.1
      - run: |
          git ls-files 'firmware/bridge/components/*.[ch]' 'firmware/bridge/main/*.[ch]' \
                       'firmware/bridge/test/host/*.c' \
                       ':!firmware/bridge/test/host/unity/*' \
            | xargs clang-format --dry-run --Werror

  firmware:
    name: Bridge firmware (ESP-IDF v5.5.1, ${{ matrix.target }})
    runs-on: ubuntu-24.04
    container: espressif/idf:v5.5.1
    strategy:
      fail-fast: false
      matrix:
        target: [esp32s3, esp32c6]
    defaults:
      run:
        working-directory: firmware/bridge
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          . "$IDF_PATH/export.sh"
          set -o pipefail
          if ! idf.py -B build-${{ matrix.target }} set-target ${{ matrix.target }} build 2>&1 | tee build.log; then
            summary=$(grep -E "error:|undefined reference|CMake Error|ERROR:" -B2 -A3 build.log \
                      | grep -v "^--$" | head -60 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::error title=idf.py build ${{ matrix.target }}::${summary}"
            exit 1
          fi
          idf.py -B build-${{ matrix.target }} size
      - name: Keep firmware
        uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.target }}
          path: |
            firmware/bridge/build-${{ matrix.target }}/*.bin
            firmware/bridge/build-${{ matrix.target }}/bootloader/bootloader.bin
            firmware/bridge/build-${{ matrix.target }}/partition_table/partition-table.bin
            firmware/bridge/build-${{ matrix.target }}/flasher_args.json
